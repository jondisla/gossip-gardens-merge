<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2f6b4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gossip Gardens</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=140">
</head>
<body>
  <div id="app">
    <div id="scene" aria-hidden="true"></div>
    <header id="hud">
      <button id="levelBtn" class="lvl" aria-label="Player level">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#fffaf0" stroke="#e4d6b8" stroke-width="5"/>
          <circle id="lvlRing" cx="20" cy="20" r="16" fill="none" stroke="#3f8a67" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 20 20)"/></svg>
        <b id="lvlNum">1</b>
      </button>
      <button id="energyBtn" class="energy" aria-label="Energy. Tap to refill">
        <span id="boltIco"></span>
        <span class="bar"><i id="energyFill"></i></span>
        <b id="energyText">100</b>
        <small id="energyTimer"></small>
        <em class="plus">+</em>
      </button>
      <div class="stat"><span id="coinIco"></span><b id="coins">0</b></div>
      <button id="gemBtn" class="stat" aria-label="Gems. Tap to open the shop"><span id="gemIco"></span><b id="gems">0</b><em class="plus">+</em></button>
      <button id="cartBtn" class="cart" aria-label="Shop"></button>
    </header>

    <div id="screens">
      <section id="screen-garden" class="screen">
        <div id="top">
          <section id="orders" aria-label="Customer orders"></section>
          <button id="happy" class="happy" aria-label="Rave Reviews: happy customers meter">
          <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="#fff7d6" stroke="#ecd9a0" stroke-width="4"/>
            <circle id="happyRing" cx="20" cy="20" r="16" fill="none" stroke="#f2a33a" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 20 20)"/>
            <circle cx="14.5" cy="17" r="2" fill="#5a3b12"/><circle cx="25.5" cy="17" r="2" fill="#5a3b12"/>
            <path d="M12.5 23.5 Q20 31.5 27.5 23.5" fill="none" stroke="#5a3b12" stroke-width="2.4" stroke-linecap="round"/></svg>
          <b id="happyNum">0/6</b>
        </button>
        </div>
        <main id="boardWrap"><div id="board" aria-label="Merge board"></div></main>
        <div id="dock">
          <button id="storeBtn" class="dock-btn" aria-label="Storage"></button>
          <section id="info" aria-live="polite"></section>
          <div id="side">
            <button id="boostBtn" class="side-btn" aria-label="Generator booster"></button>
          </div>
          <button id="repairBtn" class="dock-btn" aria-label="Repair the estate"></button>
        </div>
      </section>
      <section id="screen-estate" class="screen pad" hidden></section>
      <section id="screen-shop" class="screen pad" hidden></section>
      <section id="screen-events" class="screen pad" hidden></section>
    </div>

    <nav id="nav" aria-label="Main">
      <button data-tab="garden" class="on"><span>Kitchen</span></button>
      <button data-tab="estate"><span>Estate</span></button>
      <button data-tab="shop"><span>Shop</span></button>
      <button data-tab="events"><span>Events</span></button>
    </nav>
  </div>

  <div id="toast" role="status"></div>
  <div id="modal" hidden></div>

  <noscript>Gossip Gardens needs JavaScript to run.</noscript>

  <script src="js/data.js?v=140"></script>
  <script src="js/game.js?v=140"></script>
  <script src="js/story.js?v=140"></script>
  <script src="js/meta.js?v=140"></script>
  <script src="js/sprites.js?v=140"></script>
  <script src="js/portraits.js?v=140"></script>
  <script src="js/art.js?v=140"></script>
  <script src="js/paint.js?v=140"></script>
  <script src="js/audio.js?v=140"></script>
  <script src="js/screens.js?v=140"></script>
  <script src="js/tutorial.js?v=140"></script>
  <script src="js/ui.js?v=140"></script>
</body>
</html>
